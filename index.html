<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Quests Tracker</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-white: #ffffff;
            --accent-lime: #bffd00;
            --text-muted: #8e8e93;
            --border-dark: #1c1c1e;
        }

        @font-face {
            font-family: 'Impact-Custom';
            src: local('Impact'), local('Arial Black');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Auth Screen Styling --- */
        .auth-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            height: 80vh;
        }

        /* --- Top Header Navigation --- */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 20px 0;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .logout-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
        }

        /* --- Aggressive Display Headers --- */
        .main-title {
            font-family: 'Impact-Custom', 'Arial Black', sans-serif;
            font-size: 3.2rem;
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .marks-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
        }

        .marks-counter {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-muted);
        }

        .marks-counter span {
            color: var(--accent-lime);
        }

        .action-icon-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            background: transparent;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Grid System for Tasks --- */
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            align-items: start;
        }

        .task-card {
            background-color: var(--card-white);
            color: #000000;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card-header-text {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.2;
            word-wrap: break-word;
            margin-bottom: 20px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 900;
        }

        .task-card.completed { background-color: var(--accent-lime); }
        .task-card.completed .status-icon { background-color: #000000; color: var(--accent-lime); border-color: #000000; }

        /* --- Modal & Inputs --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal-content {
            width: 100%; max-width: 440px;
            background-color: #1c1c1e;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 24px; display: flex; flex-direction: column; gap: 16px;
        }

        .modal-input {
            background: #2c2c2e; border: none; border-radius: 14px;
            padding: 16px; color: white; font-size: 1rem; outline: none;
        }

        .btn { padding: 16px; border-radius: 14px; font-size: 1rem; font-weight: bold; border: none; cursor: pointer; }
        .btn-cancel { background-color: var(--card-white); color: #000000; }
        .btn-confirm { background-color: var(--accent-lime); color: #000000; }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <div id="auth-view" class="auth-screen">
            <div class="main-title">STAY<br>ACCOUNTABLE</div>
            <input type="email" id="auth-email" class="modal-input" placeholder="Email Address">
            <input type="password" id="auth-password" class="modal-input" placeholder="Password">
            <button class="btn btn-confirm" onclick="handleAuth('login')">LOGIN</button>
            <button class="btn btn-cancel" onclick="handleAuth('signup')">CREATE ACCOUNT</button>
        </div>

        <div id="app-view" style="display: none;">
            <div class="top-nav">
                <div class="user-profile">
                    <span>⚡ Welcome, Chad</span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="main-title">Your Notes</div>
            
            <div class="marks-row">
                <div class="marks-counter" id="marks-display">0 / 0 MARKS</div>
                <button class="action-icon-btn" onclick="openModal()">+</button>
            </div>

            <div class="tasks-grid" id="grid-container"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-title" style="font-family: 'Impact-Custom'; font-size: 2rem;">New Task & Marks</div>
            <input type="text" id="task-input" class="modal-input" placeholder="Type assignment objective...">
            <div class="modal-buttons" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn btn-confirm" onclick="addNewTask()">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, query, where, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ PASTE YOUR COPIED FIREBASE CONFIG OBJECT HERE
        const firebaseConfig = {
            apiKey: "AIzaSyArhiDmd8NEUnRAAZasFzxtY8aDCofErJk",
            authDomain: "achiver-9fd13.firebaseapp.com",
            projectId: "achiver-9fd13",
            storageBucket: "achiver-9fd13.firebasestorage.app",
            messagingSenderId: "909106740204",
            appId: "1:909106740204:web:fce2bce74d914881dddec9"
        };

        // Initialize Firebase instances
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let tasksArray = [];

        // --- AUTH LOGIC ---
        window.handleAuth = async (type) => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                if (type === 'signup') await createUserWithEmailAndPassword(auth, email, password);
                else await signInWithEmailAndPassword(auth, email, password);
            } catch (err) { alert(err.message); }
        };

        window.logout = () => signOut(auth);

        // Listen for user profile state shifts
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('app-view').style.display = 'block';
                syncTasks();
                setInterval(checkDailyReset, 20000); // Check reset status in the background
            } else {
                currentUser = null;
                document.getElementById('auth-view').style.display = 'flex';
                document.getElementById('app-view').style.display = 'none';
            }
        });

        // --- LIVE DATABASE SYNC ---
        function syncTasks() {
            const q = query(collection(db, "tasks"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                tasksArray = [];
                snapshot.forEach(doc => {
                    tasksArray.push({ id: doc.id, ...doc.data() });
                });
                renderUI();
                checkDailyReset();
            });
        }

        // --- RENDER SCREEN UI ---
        function renderUI() {
            const grid = document.getElementById('grid-container');
            let completedCount = 0;
            grid.innerHTML = '';

            tasksArray.forEach(task => {
                if (task.isCompleted) completedCount++;

                const card = document.createElement('div');
                card.className = `task-card ${task.isCompleted ? 'completed' : ''}`;
                card.onclick = () => toggleTask(task.id, task.isCompleted);
                card.innerHTML = `
                    <div class="card-header-text">${task.title}</div>
                    <div class="card-footer">
                        <span class="date-subtext">Task Active</span>
                        <div class="status-icon">${task.isCompleted ? '✓' : '✖'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('marks-display').innerHTML = `<span>${completedCount}</span> / ${tasksArray.length} MARKS`;
        }

        // --- DATABASE ACTIONS ---
        window.addNewTask = async () => {
            const input = document.getElementById('task-input');
            if (!input.value.trim()) return;
            await addDoc(collection(db, "tasks"), {
                title: input.value.trim(),
                isCompleted: false,
                userId: currentUser.uid
            });
            closeModal();
        };

        window.toggleTask = async (id, currentStatus) => {
            await updateDoc(doc(db, "tasks", id), { isCompleted: !currentStatus });
        };

        // --- AUTOMATIC 24-HOUR CLOCK RESET ---
        async function checkDailyReset() {
            const todayStr = new Date().toDateString();
            const lastReset = localStorage.getItem(`lastReset_${currentUser.uid}`);

            if (lastReset !== todayStr && tasksArray.length > 0) {
                const batch = writeBatch(db);
                tasksArray.forEach(task => {
                    if (task.isCompleted) {
                        const ref = doc(db, "tasks", task.id);
                        batch.update(ref, { isCompleted: false });
                    }
                });
                await batch.commit();
                localStorage.setItem(`lastReset_${currentUser.uid}`, todayStr);
            }
        }

        // --- UI DRAWERS OVERLAYS ---
        window.openModal = () => { document.getElementById('modal-overlay').style.display = 'flex'; document.getElementById('task-input').focus(); }
        window.closeModal = () => { document.getElementById('modal-overlay').style.display = 'none'; document.getElementById('task-input').value = ''; }
    </script>
</body>
</html>

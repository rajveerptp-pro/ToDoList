<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Quests Tracker</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-white: #ffffff;
            --accent-lime: #bffd00;
            --text-muted: #8e8e93;
            --border-dark: #1c1c1e;
            --error-red: #ff453a;
        }

        @font-face {
            font-family: 'Impact-Custom';
            src: local('Impact'), local('Arial Black');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* =========================================
           1. SPLASH / AUTHENTICATION SCREEN 
           ========================================= */
        .auth-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            min-height: 90vh;
            padding-bottom: 40px;
        }

        .splash-title {
            font-family: 'Impact-Custom', 'Arial Black', sans-serif;
            font-size: 3.5rem;
            line-height: 0.95;
            text-transform: uppercase;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .auth-inputs {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-input {
            width: 100%;
            background-color: #1c1c1e;
            border: 2px solid transparent;
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .auth-input:focus {
            border-color: var(--accent-lime);
        }

        .btn-primary {
            background-color: var(--card-white);
            color: #000000;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            margin-top: 8px;
        }

        .toggle-mode {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-decoration: underline;
            cursor: pointer;
            text-align: left;
            margin-top: 8px;
        }

        #error-message {
            color: var(--error-red);
            font-size: 0.85rem;
            font-weight: bold;
            min-height: 20px;
        }

        /* =========================================
           2. MAIN APP SCREEN 
           ========================================= */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 20px 0;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .text-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .report-btn {
            color: var(--accent-lime);
            font-weight: bold;
            text-decoration: none;
            border: 1px solid #2c2c2e;
            padding: 6px 12px;
            border-radius: 10px;
        }

        .main-title {
            font-family: 'Impact-Custom', 'Arial Black', sans-serif;
            font-size: 3.2rem;
            text-transform: uppercase;
            line-height: 0.95;
            margin-bottom: 12px;
        }

        .marks-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
        }

        .marks-counter {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-muted);
        }

        .marks-counter span { color: var(--accent-lime); }

        .action-icon-btn {
            width: 40px; height: 40px;
            border: 1px solid var(--border-dark); border-radius: 12px;
            background: transparent; color: white;
            font-size: 1.4rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Grid System */
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            align-items: start;
        }

        .task-card {
            background-color: var(--card-white);
            color: #000000;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card-header-text {
            font-size: 1.15rem; font-weight: 700; line-height: 1.2;
            word-wrap: break-word; margin-bottom: 20px;
        }

        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .status-icon {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid #000000; display: flex; align-items: center;
            justify-content: center; font-size: 0.7rem; font-weight: 900;
        }

        .task-card.completed { background-color: var(--accent-lime); }
        .task-card.completed .status-icon { background-color: #000000; color: var(--accent-lime); border-color: #000000; }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); display: none;
            justify-content: center; align-items: flex-end; z-index: 100;
        }

        .modal-content {
            width: 100%; max-width: 440px; background-color: #1c1c1e;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 24px; display: flex; flex-direction: column; gap: 16px;
        }

        .modal-input { background: #2c2c2e; border: none; border-radius: 14px; padding: 16px; color: white; font-size: 1rem; outline: none; }
        .btn { padding: 16px; border-radius: 14px; font-size: 1rem; font-weight: bold; border: none; cursor: pointer; }
        .btn-cancel { background-color: var(--card-white); color: #000000; }
        .btn-confirm { background-color: var(--accent-lime); color: #000000; }
    </style>
</head>
<body>

    <div class="mobile-frame">
        
        <div id="auth-view" class="auth-screen">
            <div class="splash-title">You suck at taking notes brother, you need us :)</div>
            
            <div id="error-message"></div>

            <div class="auth-inputs">
                <input type="email" id="auth-email" class="auth-input" placeholder="Email Address">
                <input type="password" id="auth-password" class="auth-input" placeholder="Password">
            </div>

            <button class="btn-primary" id="auth-submit-btn" onclick="processAuth()">Join Now</button>
            <button class="toggle-mode" id="auth-toggle-btn" onclick="toggleAuthMode()">Already have an account? Log in here.</button>
        </div>

        <div id="app-view" style="display: none;">
            <div class="top-nav">
                <div class="user-profile">
                    <span>👤 Welcome back</span>
                </div>
                <div class="nav-links">
                    <a href="report.html" class="report-btn">Stats</a>
                    <button class="text-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="main-title">Your Notes</div>
            
            <div class="marks-row">
                <div class="marks-counter" id="marks-display">0 / 0 MARKS</div>
                <button class="action-icon-btn" onclick="openModal()">+</button>
            </div>

            <div class="tasks-grid" id="grid-container"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="main-title" style="font-size: 2rem;">New Task</div>
            <input type="text" id="task-input" class="modal-input" placeholder="Type assignment objective...">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn btn-confirm" onclick="addNewTask()">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ REPLACE THIS BLOCK WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let tasksArray = [];
        let isLoginMode = false;

        // --- UI TOGGLING FOR AUTH SCREEN ---
        window.toggleAuthMode = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('error-message').innerText = "";
            
            if (isLoginMode) {
                document.getElementById('auth-submit-btn').innerText = "Log In";
                document.getElementById('auth-submit-btn').style.backgroundColor = "var(--accent-lime)";
                document.getElementById('auth-toggle-btn').innerText = "Need an account? Sign up here.";
            } else {
                document.getElementById('auth-submit-btn').innerText = "Join Now";
                document.getElementById('auth-submit-btn').style.backgroundColor = "var(--card-white)";
                document.getElementById('auth-toggle-btn').innerText = "Already have an account? Log in here.";
            }
        };

        // --- AUTHENTICATION PROCESSING ---
        window.processAuth = async () => {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const errorBox = document.getElementById('error-message');
            errorBox.innerText = "";

            if (!email || !password) { errorBox.innerText = "Please fill in all fields."; return; }

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/email-already-in-use') errorBox.innerText = "Email already registered.";
                else if (error.code === 'auth/invalid-credential') errorBox.innerText = "Incorrect email or password.";
                else if (error.code === 'auth/configuration-not-found') errorBox.innerText = "Firebase Error: Enable Email/Password in console.";
                else errorBox.innerText = error.message;
            }
        };

        window.logout = () => signOut(auth);

        // --- STATE LISTENER (Switches between Login and App) ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('app-view').style.display = 'block';
                syncTasks();
                setInterval(checkDailyReset, 20000);
            } else {
                currentUser = null;
                document.getElementById('auth-view').style.display = 'flex';
                document.getElementById('app-view').style.display = 'none';
                document.getElementById('auth-password').value = ""; // Clear password on logout
            }
        });

        // --- FIRESTORE SYNC & UI RENDERING ---
        function syncTasks() {
            const q = query(collection(db, "tasks"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                tasksArray = [];
                snapshot.forEach(doc => { tasksArray.push({ id: doc.id, ...doc.data() }); });
                renderGridUI();
                checkDailyReset();
            });
        }

        function renderGridUI() {
            const grid = document.getElementById('grid-container');
            let completedCount = 0;
            grid.innerHTML = '';

            tasksArray.forEach(task => {
                if (task.isCompleted) completedCount++;

                const card = document.createElement('div');
                card.className = `task-card ${task.isCompleted ? 'completed' : ''}`;
                card.onclick = () => toggleTask(task.id, task.isCompleted);
                card.innerHTML = `
                    <div class="card-header-text">${task.title}</div>
                    <div class="card-footer">
                        <span style="font-size:0.75rem; color:#666; font-weight:bold;">Active Task</span>
                        <div class="status-icon">${task.isCompleted ? '✓' : '✖'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('marks-display').innerHTML = `<span>${completedCount}</span> / ${tasksArray.length} MARKS`;
        }

        // --- TASK ACTIONS ---
        window.addNewTask = async () => {
            const input = document.getElementById('task-input');
            if (!input.value.trim()) return;
            await addDoc(collection(db, "tasks"), {
                title: input.value.trim(),
                isCompleted: false,
                userId: currentUser.uid
            });
            closeModal();
        };

        window.toggleTask = async (id, currentStatus) => {
            await updateDoc(doc(db, "tasks", id), { isCompleted: !currentStatus });
        };

        // --- 24-HOUR RESET LOOP ---
        async function checkDailyReset() {
            const todayStr = new Date().toDateString();
            const lastReset = localStorage.getItem(`lastReset_${currentUser.uid}`);

            if (lastReset !== todayStr && tasksArray.length > 0) {
                const batch = writeBatch(db);
                tasksArray.forEach(task => {
                    if (task.isCompleted) {
                        const ref = doc(db, "tasks", task.id);
                        batch.update(ref, { isCompleted: false });
                    }
                });
                await batch.commit();
                localStorage.setItem(`lastReset_${currentUser.uid}`, todayStr);
            }
        }

        // --- MODAL CONTROLS ---
        window.openModal = () => { document.getElementById('modal-overlay').style.display = 'flex'; document.getElementById('task-input').focus(); }
        window.closeModal = () => { document.getElementById('modal-overlay').style.display = 'none'; document.getElementById('task-input').value = ''; }
    </script>
</body>
</html>

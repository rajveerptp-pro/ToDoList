<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Quests Tracker</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-white: #ffffff;
            --accent-lime: #bffd00;
            --text-muted: #8e8e93;
            --border-dark: #1c1c1e;
            --error-red: #ff453a;
        }

        @font-face {
            font-family: 'Impact-Custom';
            src: local('Impact'), local('Arial Black');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- GLOBAL UI COMPONENTS --- */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 20px 0;
        }

        .main-title {
            font-family: 'Impact-Custom', sans-serif;
            font-size: 3.2rem;
            text-transform: uppercase;
            line-height: 0.95;
            margin-bottom: 12px;
        }

        .text-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            font-weight: bold;
        }

        .btn {
            padding: 16px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
        }

        /* --- 1. AUTH SCREEN --- */
        .auth-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
            min-height: 90vh;
            padding-bottom: 40px;
        }

        .auth-input {
            width: 100%;
            background-color: #1c1c1e;
            border: 2px solid transparent;
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
        }

        .auth-input:focus {
            border-color: var(--accent-lime);
        }

        .btn-primary {
            background-color: var(--card-white);
            color: #000000;
            margin-top: 8px;
        }

        /* --- 2. MAIN APP SCREEN --- */
        .marks-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
        }

        .marks-counter {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-muted);
        }

        .marks-counter span {
            color: var(--accent-lime);
        }

        .action-icon-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            background: transparent;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .task-card {
            background-color: var(--card-white);
            color: #000000;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            cursor: pointer;
        }

        .card-header-text {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            word-wrap: break-word;
        }

        .status-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 900;
        }

        .task-card.completed {
            background-color: var(--accent-lime);
        }

        .task-card.completed .status-icon {
            background-color: #000000;
            color: var(--accent-lime);
            border-color: #000000;
        }

        /* --- 3. REPORT SCREEN --- */
        .stats-summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: var(--border-dark);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
        }

        .stat-value.highlight {
            color: var(--accent-lime);
        }

        .chart-container {
            background-color: var(--border-dark);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .bar-chart {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 160px;
            padding-top: 20px;
            border-bottom: 1px solid #333;
        }

        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            gap: 8px;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 24px;
            background-color: #333;
            border-radius: 6px 6px 0 0;
            height: 0%;
            transition: height 0.6s ease;
        }

        .bar.active {
            background-color: var(--accent-lime);
        }

        .bar-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: bold;
            margin-bottom: -24px;
            text-transform: uppercase;
        }

        .grade-callout {
            border: 2px dashed var(--border-dark);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .grade-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .grade-text span {
            color: var(--accent-lime);
            font-weight: 800;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal-content {
            width: 100%;
            max-width: 440px;
            background-color: #1c1c1e;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-input {
            background: #2c2c2e;
            border: none;
            border-radius: 14px;
            padding: 16px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
    </style>
</head>

<body>

    <div class="mobile-frame">

        <div id="auth-view" class="auth-screen">
            <div class="main-title" style="font-size: 3.5rem; letter-spacing: -0.5px;">You stuck at taking notes
                brother, you need us : )</div>
            <div id="error-message"
                style="color: var(--error-red); font-size: 0.85rem; font-weight: bold; min-height: 20px;"></div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <input type="email" id="auth-email" class="auth-input" placeholder="Email Address">
                <input type="password" id="auth-password" class="auth-input" placeholder="Password">
            </div>
            <button class="btn btn-primary" id="auth-submit-btn" onclick="processAuth()">Join Now</button>
            <button class="text-btn" id="auth-toggle-btn" onclick="toggleAuthMode()"
                style="text-align: left; margin-top: 8px;">Already have an account? Log in here.</button>
        </div>

        <div id="app-view" style="display: none;">
            <div class="top-nav">
                <div style="display: flex; align-items: center; gap: 10px; font-weight: 500;">👤 Welcome back</div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <button class="text-btn" onclick="switchView('report')"
                        style="color: var(--accent-lime); border: 1px solid #2c2c2e; padding: 6px 12px; border-radius: 10px; text-decoration: none;">Stats
                        →</button>
                    <button class="text-btn" onclick="logout()">Logout</button>
                </div>
            </div>
            <div class="main-title">Your Notes</div>
            <div class="marks-row">
                <div class="marks-counter" id="marks-display">0 / 0 MARKS</div>
                <button class="action-icon-btn" onclick="openModal()">+</button>
            </div>
            <div class="tasks-grid" id="grid-container"></div>
        </div>

        <div id="report-view" style="display: none;">
            <div class="top-nav">
                <button class="text-btn" onclick="switchView('app')">← Back to Quests</button>
                <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: bold;">ANALYTICS SYSTEM</span>
            </div>
            <div class="main-title">Weekly<br>Performance</div>
            <div class="stats-summary-grid">
                <div class="stat-card">
                    <span class="stat-label">Weekly Score</span>
                    <span class="stat-value highlight" id="weekly-accuracy">0%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Tasks Finished</span>
                    <span class="stat-value" id="weekly-total-completed">0</span>
                </div>
            </div>
            <div class="chart-container">
                <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; text-transform: uppercase;">7-Day
                    Tracker</div>
                <div class="bar-chart" id="analytics-bars">
                    <div class="bar-wrapper">
                        <div class="bar" id="bar-Mon"></div><span class="bar-label">Mon</span>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar" id="bar-Tue"></div><span class="bar-label">Tue</span>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar" id="bar-Wed"></div><span class="bar-label">Wed</span>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar" id="bar-Thu"></div><span class="bar-label">Thu</span>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar" id="bar-Fri"></div><span class="bar-label">Fri</span>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar" id="bar-Sat"></div><span class="bar-label">Sat</span>
                    </div>
                    <div class="bar-wrapper">
                        <div class="bar" id="bar-Sun"></div><span class="bar-label">Sun</span>
                    </div>
                </div>
            </div>
            <div class="grade-callout">
                <p class="grade-text" id="grade-message">Loading evaluation...</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="main-title" style="font-size: 2rem;">New Task</div>
            <input type="text" id="task-input" class="modal-input" placeholder="Type assignment objective..."
                autocomplete="off">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button class="btn" style="background: var(--card-white); color: black;"
                    onclick="closeModal()">Cancel</button>
                <button class="btn" style="background: var(--accent-lime); color: black;"
                    onclick="addNewTask()">Confirm</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ REPLACE THIS BLOCK WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyArhiDmd8NEUnRAAZasFzxtY8aDCofErJk",
            authDomain: "achiver-9fd13.firebaseapp.com",
            projectId: "achiver-9fd13",
            storageBucket: "achiver-9fd13.firebasestorage.app",
            messagingSenderId: "909106740204",
            appId: "1:909106740204:web:fce2bce74d914881dddec9",
            measurementId: "G-LKM2ZMVQYP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let tasksArray = [];
        let isLoginMode = false;

        // --- VIEW ROUTER ---
        window.switchView = (viewName) => {
            document.getElementById('auth-view').style.display = 'none';
            document.getElementById('app-view').style.display = 'none';
            document.getElementById('report-view').style.display = 'none';

            document.getElementById(`${viewName}-view`).style.display = 'flex';
            document.getElementById(`${viewName}-view`).style.flexDirection = 'column';

            if (viewName === 'report') calculateAnalytics();
        };

        // --- AUTH LOGIC ---
        window.toggleAuthMode = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('error-message').innerText = "";
            if (isLoginMode) {
                document.getElementById('auth-submit-btn').innerText = "Log In";
                document.getElementById('auth-submit-btn').style.backgroundColor = "var(--accent-lime)";
                document.getElementById('auth-toggle-btn').innerText = "Need an account? Sign up here.";
            } else {
                document.getElementById('auth-submit-btn').innerText = "Join Now";
                document.getElementById('auth-submit-btn').style.backgroundColor = "var(--card-white)";
                document.getElementById('auth-toggle-btn').innerText = "Already have an account? Log in here.";
            }
        };

        window.processAuth = async () => {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const errorBox = document.getElementById('error-message');
            errorBox.innerText = "";

            if (!email || !password) { errorBox.innerText = "Please fill in all fields."; return; }

            try {
                if (isLoginMode) await signInWithEmailAndPassword(auth, email, password);
                else await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') errorBox.innerText = "Email already registered.";
                else if (error.code === 'auth/invalid-credential') errorBox.innerText = "Incorrect email or password.";
                else errorBox.innerText = error.message;
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                switchView('app');
                syncTasks();
                setInterval(checkDailyReset, 20000);
            } else {
                currentUser = null;
                switchView('auth');
                document.getElementById('auth-password').value = "";
            }
        });

        // --- DATABASE & APP LOGIC ---
        function syncTasks() {
            const q = query(collection(db, "tasks"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                tasksArray = [];
                snapshot.forEach(doc => tasksArray.push({ id: doc.id, ...doc.data() }));
                renderGridUI();
            });
        }

        function renderGridUI() {
            const grid = document.getElementById('grid-container');
            let completedCount = 0;
            grid.innerHTML = '';

            tasksArray.forEach(task => {
                if (task.isCompleted) completedCount++;
                const card = document.createElement('div');
                card.className = `task-card ${task.isCompleted ? 'completed' : ''}`;
                card.onclick = () => toggleTask(task.id, task.isCompleted);
                card.innerHTML = `
                    <div class="card-header-text">${task.title}</div>
                    <div class="card-footer">
                        <span style="font-size:0.75rem; color:#666; font-weight:bold;">Active Task</span>
                        <div class="status-icon">${task.isCompleted ? '✓' : '✖'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('marks-display').innerHTML = `<span>${completedCount}</span> / ${tasksArray.length} MARKS`;
        }

        window.addNewTask = async () => {
           const input = document.getElementById('task-input');
    if (!input.value.trim()) return;
    
    try {
        await addDoc(collection(db, "tasks"), { 
            title: input.value.trim(), 
            isCompleted: false, 
            userId: currentUser.uid 
        });
        closeModal();
    } catch (error) {
        console.error(error);
        alert("DATABASE ERROR: " + error.message); // This will pop up on your screen if it fails
    }
        };

        window.toggleTask = async (id, currentStatus) => { await updateDoc(doc(db, "tasks", id), { isCompleted: !currentStatus }); };

        async function checkDailyReset() {
            const todayStr = new Date().toDateString();
            const lastReset = localStorage.getItem(`lastReset_${currentUser.uid}`);
            if (lastReset !== todayStr && tasksArray.length > 0) {
                const batch = writeBatch(db);
                tasksArray.forEach(task => {
                    if (task.isCompleted) {
                        const ref = doc(db, "tasks", task.id);
                        batch.update(ref, { isCompleted: false });
                    }
                });
                await batch.commit();
                localStorage.setItem(`lastReset_${currentUser.uid}`, todayStr);
            }
        }

        // --- ANALYTICS ENGINE ---
        function calculateAnalytics() {
            let totalTasks = tasksArray.length;
            let completedTasks = tasksArray.filter(t => t.isCompleted).length;
            const accuracy = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

            document.getElementById('weekly-accuracy').innerText = `${accuracy}%`;
            document.getElementById('weekly-total-completed').innerText = completedTasks;

            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const currentDayName = days[new Date().getDay()];
            localStorage.setItem(`history_${currentUser.uid}_${currentDayName}`, accuracy);

            days.forEach(day => {
                const targetBar = document.getElementById(`bar-${day}`);
                if (targetBar) {
                    const savedVal = localStorage.getItem(`history_${currentUser.uid}_${day}`) || 0;
                    targetBar.style.height = `${savedVal}%`;
                    if (parseInt(savedVal) > 0) targetBar.classList.add('active');
                }
            });

            const msg = document.getElementById('grade-message');
            if (accuracy >= 90) msg.innerHTML = "STATUS: <span>ELITE</span>. YOU ARE DESTROYING ASSIGNMENTS.";
            else if (accuracy >= 75) msg.innerHTML = "STATUS: <span>STRONG</span>. KEEP PUSHING.";
            else if (accuracy >= 50) msg.innerHTML = "STATUS: <span>AVERAGE</span>. EXECUTE EARLIER.";
            else msg.innerHTML = "STATUS: <span>FAILURE MODE</span>. WORK HARDER.";
        }

        // --- MODAL CONTROLS ---
        window.openModal = () => { document.getElementById('modal-overlay').style.display = 'flex'; document.getElementById('task-input').focus(); }
        window.closeModal = () => { document.getElementById('modal-overlay').style.display = 'none'; document.getElementById('task-input').value = ''; }
    </script>
</body>

</html>

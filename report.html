<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brutal Weekly Analytics</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-dark: #1c1c1e;
            --accent-lime: #bffd00;
            --text-muted: #8e8e93;
            --border-dark: #2c2c2e;
        }

        @font-face {
            font-family: 'Impact-Custom';
            src: local('Impact'), local('Arial Black');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
        }

        /* --- Navigation Top Bar --- */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 20px 0;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--border-dark);
            color: white;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        /* --- Brutal Layout Typography --- */
        .main-title {
            font-family: 'Impact-Custom', 'Arial Black', sans-serif;
            font-size: 3.2rem;
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        /* --- Summary Cards --- */
        .stats-summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: var(--card-dark);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
        }

        .stat-value.highlight {
            color: var(--accent-lime);
        }

        /* --- Custom CSS Chart Architecture --- */
        .chart-container {
            background-color: var(--card-dark);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .chart-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .bar-chart {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 160px;
            padding-top: 20px;
            border-bottom: 1px solid var(--border-dark);
        }

        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            gap: 8px;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 24px;
            background-color: #2c2c2e;
            border-radius: 6px 6px 0 0;
            height: 0%; /* Dynamic allocation */
            transition: height 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .bar.active {
            background-color: var(--accent-lime);
        }

        .bar-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: bold;
            margin-bottom: -24px;
            text-transform: uppercase;
        }

        .bar-value-popup {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            font-weight: bold;
            color: #ffffff;
        }

        /* --- Footer Grading Callout --- */
        .grade-callout {
            border: 2px dashed var(--border-dark);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-top: 12px;
        }

        .grade-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .grade-text span {
            color: var(--accent-lime);
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <div class="top-nav">
            <a href="index.html" class="back-btn">← Quests</a>
            <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: bold;">ANALYTICS SYSTEM</span>
        </div>

        <div class="main-title">Weekly<br>Performance</div>

        <div class="stats-summary-grid">
            <div class="stat-card">
                <span class="stat-label">Weekly Score</span>
                <span class="stat-value highlight" id="weekly-accuracy">0%</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Tasks Finished</span>
                <span class="stat-value" id="weekly-total-completed">0</span>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-header">7-Day Completion Tracker</div>
            <div class="bar-chart" id="analytics-bars">
                <div class="bar-wrapper"><div class="bar" id="bar-Mon"><span class="bar-value-popup">0</span></div><span class="bar-label">Mon</span></div>
                <div class="bar-wrapper"><div class="bar" id="bar-Tue"><span class="bar-value-popup">0</span></div><span class="bar-label">Tue</span></div>
                <div class="bar-wrapper"><div class="bar" id="bar-Wed"><span class="bar-value-popup">0</span></div><span class="bar-label">Wed</span></div>
                <div class="bar-wrapper"><div class="bar" id="bar-Thu"><span class="bar-value-popup">0</span></div><span class="bar-label">Thu</span></div>
                <div class="bar-wrapper"><div class="bar" id="bar-Fri"><span class="bar-value-popup">0</span></div><span class="bar-label">Fri</span></div>
                <div class="bar-wrapper"><div class="bar" id="bar-Sat"><span class="bar-value-popup">0</span></div><span class="bar-label">Sat</span></div>
                <div class="bar-wrapper"><div class="bar" id="bar-Sun"><span class="bar-value-popup">0</span></div><span class="bar-label">Sun</span></div>
            </div>
        </div>

        <div class="grade-callout">
            <p class="grade-text" id="grade-message">Loading performance evaluation...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ PASTE YOUR EXACT COPIED FIREBASE CONFIG OBJECT HERE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security Route Guard Checklist
        onAuthStateChanged(auth, (user) => {
            if (user) {
                calculateWeeklyAnalytics(user.uid);
            } else {
                // If not logged in, redirect straight back to main portal screen
                window.location.href = "index.html";
            }
        });

        function calculateWeeklyAnalytics(uid) {
            const q = query(collection(db, "tasks"), where("userId", "==", uid));
            
            onSnapshot(q, (snapshot) => {
                let totalTasksCount = 0;
                let completedTasksCount = 0;

                snapshot.forEach(doc => {
                    totalTasksCount++;
                    if (doc.data().isCompleted) {
                        completedTasksCount++;
                    }
                });

                // Calculate Live Real-Time Analytics Percentage Ratio
                const accuracy = totalTasksCount > 0 ? Math.round((completedTasksCount / totalTasksCount) * 100) : 0;
                
                // Render Numbers into Dashboard Cards
                document.getElementById('weekly-accuracy').innerText = `${accuracy}%`;
                document.getElementById('weekly-total-completed').innerText = completedTasksCount;

                // Update Visual Progress Chart Height Bars
                updatePerformanceChart(accuracy);
                generateMotivationalGrade(accuracy);
            });
        }

        function updatePerformanceChart(percentage) {
            // Find current system day name shortcut (e.g. "Mon", "Tue")
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const currentDayName = days[new Date().getDay()];
            
            // Save today's historical metric into browser store structure
            localStorage.setItem(`history_score_${currentDayName}`, percentage);

            // Scan through all chart elements to pull saved logs and paint them
            days.forEach(day => {
                const targetBar = document.getElementById(`bar-${day}`);
                if (targetBar) {
                    const savedValue = localStorage.getItem(`history_score_${day}`) || 0;
                    
                    // Direct layout property update to alter CSS heights dynamically
                    targetBar.style.height = `${savedValue}%`;
                    targetBar.querySelector('.bar-value-popup').innerText = `${savedValue}%`;

                    if (parseInt(savedValue) > 0) {
                        targetBar.classList.add('active');
                    }
                }
            });
        }

        function generateMotivationalGrade(score) {
            const msgContainer = document.getElementById('grade-message');
            if (score >= 90) {
                msgContainer.innerHTML = "STATUS: <span>ELITE CHAD</span>. YOU ARE ABSOLUTELY DESTROYING YOUR DAILY ASSIGNMENTS.";
            } else if (score >= 75) {
                msgContainer.innerHTML = "STATUS: <span>STRONG RUN</span>. CONSTANT ADVANCEMENT RECORDED. KEEP PUSHING.";
            } else if (score >= 50) {
                msgContainer.innerHTML = "STATUS: <span>AVERAGE OUT</span>. SLACKING DETECTED. EXECUTE OBJECTIVES EARLIER.";
            } else {
                msgContainer.innerHTML = "STATUS: <span>FAILURE MODE</span>. WORK EXTENSION REQUIRED TO SECURE YOUR POINTS.";
            }
        }
    </script>
</body>
</html>
